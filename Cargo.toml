[workspace]
members = [
    "crates/omnilink-protocol",
    "crates/omnilink-daemon",
    "crates/omnilink-cli",
    "crates/omnilink-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Omnilink Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Workspace crates
omnilink-protocol = { path = "crates/omnilink-protocol" }
omnilink-daemon = { path = "crates/omnilink-daemon" }

# Async Runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Networking & Security
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
base64 = "0.22"
qrcode = "0.14"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
libc = "0.2"

# Linux Desktop Integration
zbus = { version = "5.0", features = ["tokio"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
bluer = { version = "0.17", features = ["bluetoothd"] }
pipewire = { version = "0.8" }

# Serialization & CLI
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
directories = "5.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
uuid = "1.28"

